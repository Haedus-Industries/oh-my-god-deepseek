[project]
name = "deepseek-prompt-bench"
version = "0.1.0"
description = "Reproducible, budget-limited DeepSWE identity prompt exploration"
requires-python = ">=3.12,<3.14"
dependencies = ["aiohttp>=3.12,<4", "deepseek-harness-sdk==0.1.5rc1", "PyYAML>=6,<7", "requests>=2.32,<3"]

[project.scripts]
bench = "dsbench.cli:main"

[project.optional-dependencies]
cloud = ["datacurve-pier @ git+https://github.com/datacurve-ai/pier.git@0c802fc067a425345b24d1c69411aa98acf61a1d"]
analysis = ["numpy>=2,<3", "scipy>=1.15,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
